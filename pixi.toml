[workspace]
channels = ['https://conda.modular.com/max', 'conda-forge']
name = "mojo-gemm"
platforms = ['osx-arm64']
version = "0.1.0"

[tasks]
build = "mojo build -O3 -I . bench.mojo -o bench"
test = "mojo build -O3 -I . test.mojo -o test-gemm && ./test-gemm neon && ./test-gemm sme"

[dependencies]
mojo = ">=1.2.0,<2"
